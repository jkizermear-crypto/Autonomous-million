name: Autonomous Million Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: autonomous-million-state
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Discover and screen GitHub bounty candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re, urllib.parse, urllib.request, urllib.error

          root = pathlib.Path('.')
          state_path = root / 'agent_state.json'
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          state.setdefault('opportunities', [])
          state.setdefault('blocked_repositories', [])
          blocked = {str(x).lower().strip('/') for x in state['blocked_repositories']}
          blocked.add('senthemodder/aquarium-of-gullibles')
          state['blocked_repositories'] = sorted(blocked)
          rejected = {x.get('url') for x in state.get('rejected_opportunities', [])}
          known = {x.get('url') for x in state['opportunities']}
          def repo_of(url):
              m = re.fullmatch(r'https://github\.com/([^/]+)/([^/]+)/issues/\d+', url or '')
              return (m.group(1) + '/' + m.group(2)).lower() if m else ''

          quarantined = 0
          for item in state['opportunities']:
              if repo_of(item.get('url')) in blocked:
                  item['status'] = 'blocked_repository_safety_review'
                  item['payment_verified'] = False
                  quarantined += 1
          for item in state.get('triage', []):
              if repo_of(item.get('url')) in blocked:
                  item['status'] = 'blocked_repository_safety_review'
          for item in state.get('experiments', []):
              if repo_of(item.get('opportunity_url')) in blocked:
                  item['status'] = 'blocked_safety_review'

          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'User-Agent': 'AutonomousMillion-CredibleScout-v4'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.load(resp)

          searches = [
              'is:issue is:open "bounty" "escrow" archived:false',
              'is:issue is:open "USDC" "pull request" archived:false',
              'is:issue is:open "reward" "acceptance criteria" archived:false',
              'is:issue is:open "gitcoin" "bounty" archived:false',
              'is:issue is:open "onlydust" "reward" archived:false',
          ]
          found, errors = {}, []
          for query in searches:
              params = urllib.parse.urlencode({'q': query, 'sort': 'updated',
                                               'order': 'desc', 'per_page': 20})
              try:
                  for issue in get('https://api.github.com/search/issues?' + params).get('items', []):
                      if 'pull_request' not in issue:
                          found[issue['html_url']] = issue
              except (urllib.error.HTTPError, urllib.error.URLError, ValueError) as exc:
                  errors.append(type(exc).__name__ + ' while searching ' + query)

          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          selected, rejected_counts = [], {}
          def reject(reason):
              rejected_counts[reason] = rejected_counts.get(reason, 0) + 1
          for url, issue in found.items():
              if url in known or url in rejected:
                  reject('already_known_or_rejected')
                  continue
              repository = repo_of(url)
              if not repository or repository in blocked:
                  reject('blocked_or_invalid_repository')
                  continue
              title = issue.get('title') or ''
              body = (issue.get('body') or '')[:12000]
              combined = title + '\n' + body
              flags = []
              checks = [
                  (r'(?i)(seed phrase|private key|recovery phrase|connect your wallet|verification fee|pay (?:a |the )?fee)', 'wallet_or_fee_request'),
                  (r'(?i)(register|verify|unlock|activate).{0,90}(fee|deposit|wallet|signature)', 'external_verification_demand'),
                  (r'(?i)(lottery|raffle|giveaway|prediction contest|weekly close contest)', 'contest'),
                  (r'(?i)(dependency dashboard|renovate dashboard)', 'maintenance_issue'),
              ]
              for pattern, label in checks:
                  if re.search(pattern, combined):
                      flags.append(label)
              if flags:
                  reject('safety_flags')
                  continue
              evidence = {
                  'explicit_reward': bool(re.search(r'(?i)(?:\$\s?\d[\d,]*(?:\.\d+)?|\b\d[\d,]*\s*(?:USDC|USD)\b)', combined)),
                  'acceptance_criteria': bool(re.search(r'(?i)(acceptance criteria|deliverables|definition of done|requirements)', combined)),
                  'submission_method': bool(re.search(r'(?i)(pull request|submit (?:a |your )?PR|merged PR)', combined)),
                  'escrow_or_platform_claim': bool(re.search(r'(?i)(escrow|gitcoin|onlydust|bounty platform|payout)', combined)),
              }
              if not all(evidence[k] for k in ('explicit_reward', 'acceptance_criteria', 'submission_method')):
                  reject('missing_reward_or_deliverables')
                  continue
              selected.append({
                  'url': url, 'title': title[:200], 'repository': repository,
                  'description_excerpt': body[:1800], 'updated_at': issue.get('updated_at'),
                  'labels': [x.get('name', '') for x in issue.get('labels', [])],
                  'discovered_at': now, 'status': 'unverified',
                  'screening_evidence': evidence, 'screening_score': sum(evidence.values()),
                  'screening_flags': [], 'payment_verified': False,
              })
          selected.sort(key=lambda x: (-x['screening_score'], x['url']))
          added = selected[:12]
          state['opportunities'].extend(added)
          state['runs'] = int(state.get('runs', 0)) + 1
          state['last_run_at'] = now
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')
          report = ['# Credible Scout v4', '', f'Checked: {now}',
                    f'GitHub issues returned: {len(found)}',
                    f'New candidates stored: {len(added)}',
                    f'Previously stored blocked-repository items quarantined: {quarantined}',
                    'All saved candidates are UNVERIFIED; no payment or escrow was authenticated.', '',
                    '## Exclusion counts']
          report += [f'- {key}: {value}' for key, value in sorted(rejected_counts.items())]
          report += ['', '## New candidates']
          for item in added:
              report += [f'- {item["url"]} — evidence indicators {item["screening_score"]}/4; payment verified: no']
          report += ['', '## Search errors'] + (['- ' + x for x in errors] or ['- None'])
          report += ['', 'No third-party code execution, submissions, spending, or wallet access.']
          reports = root / 'reports'
          reports.mkdir(exist_ok=True)
          (reports / 'credible-scout-latest.md').write_text('\n'.join(report) + '\n')
          print(f'Scouted {len(found)} issues; saved {len(added)} unverified candidates.')
          PY
      - name: Save scout report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent_state.json reports/credible-scout-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'Agent: stricter credible bounty discovery'
            git push
          fi
