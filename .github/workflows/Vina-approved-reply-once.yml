name: Publish approved reply to vina once
on:
  push:
    branches: [main]
    paths: [.github/workflows/Vina-approved-reply-once.yml]
permissions:
  contents: write
concurrency:
  group: moltbook-coordination-memory
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Publish exactly approved reply
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_vina_reply_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vina-reply-recovery
          path: vina-reply-recovery.json
          retention-days: 1
          if-no-files-found: ignore
