name: Autonomous Million Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-million-state
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Find and screen public bounty opportunities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re, urllib.parse, urllib.request, urllib.error
          path=pathlib.Path('agent_state.json')
          state=json.loads(path.read_text()) if path.exists() else {}
          state.setdefault('opportunities',[])
          known={o.get('url') for o in state['opportunities']}
          rejected={o.get('url') for o in state.get('rejected_opportunities',[])}
          headers={'Accept':'application/vnd.github+json',
                   'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'User-Agent':'AutonomousMillion-CredibleScout'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
                  return json.load(r)
          searches=[
              'is:issue is:open label:bounty "USDC" archived:false',
              'is:issue is:open "bounty" "acceptance criteria" archived:false',
              'is:issue is:open "reward" "pull request" archived:false',
          ]
          results={}
          errors=[]
          for q in searches:
              url='https://api.github.com/search/issues?'+urllib.parse.urlencode({
                  'q':q,'sort':'updated','order':'desc','per_page':20})
              try:
                  for item in get(url).get('items',[]):
                      if 'pull_request' not in item:
                          results[item['html_url']]=item
              except (urllib.error.HTTPError,urllib.error.URLError) as exc:
                  errors.append(f'Search unavailable: {type(exc).__name__}')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          added=0
          report=['# Credible Scout — evidence-based discovery','',
                  f'UTC: {now}','',
                  'All opportunities are unverified. A high score does NOT verify payment.','']
          scored=[]
          for url,item in results.items():
              if url in known or url in rejected:
                  continue
              body=(item.get('body') or '')[:10000]
              title=item.get('title') or ''
              text=title+'\n'+body
              repo=item.get('repository_url','').split('/repos/')[-1]
              labels=[x.get('name','') for x in item.get('labels',[])]
              red_flags=[]
              if re.search(r'(?i)(registration|verification|activate|unlock).{0,90}(fee|payment|wallet|deposit|signature)',text):
                  red_flags.append('External verification or payment prerequisite')
              if re.search(r'(?i)(seed phrase|private key|recovery phrase|connect your wallet|pay (?:a |the )?fee)',text):
                  red_flags.append('Sensitive credential, wallet or fee request')
              if re.search(r'(?i)(contact .*discord.*payment|dm .* for payment)',text):
                  red_flags.append('Private payment negotiation')
              if re.search(r'(?i)(prediction contest|weekly close contest|giveaway|raffle|lottery)',text):
                  red_flags.append('Contest or speculative listing')
              if re.search(r'(?i)(dependency dashboard|renovate dashboard)',text):
                  red_flags.append('Automated maintenance issue')
              evidence={
                  'reward_amount_stated':bool(re.search(r'(?i)(?:\$\s?\d[\d,]*(?:\.\d+)?|[\d,]+\s*(?:USDC|USD|XTM|ETH))\b',text)),
                  'acceptance_criteria_stated':bool(re.search(r'(?i)(acceptance criteria|deliverables|requirements|definition of done)',text)),
                  'submission_method_stated':bool(re.search(r'(?i)(pull request|submit (?:a |your )?PR|merge)',text)),
                  'payment_mechanism_stated':bool(re.search(r'(?i)(escrow|on.chain|bounty platform|payout)',text)),
              }
              score=sum(evidence.values())
              status='safety_review' if red_flags else 'unverified'
              record={'url':url,'title':title[:200],'repository':repo,
                      'description_excerpt':body[:1800],
                      'updated_at':item.get('updated_at'),'labels':labels,
                      'discovered_at':now,'status':status,
                      'screening_evidence':evidence,'screening_score':score,
                      'screening_flags':red_flags,'payment_verified':False}
              scored.append(record)
          scored.sort(key=lambda x:(x['status']!='unverified',-x['screening_score'],x['url']))
          # Store at most 12 per run. A score is a prioritization heuristic only.
          for record in scored[:12]:
              state['opportunities'].append(record)
              added+=1
              report += [f'## {record["url"]}',f'Status: {record["status"]}',
                         f'Evidence indicators: {record["screening_score"]}/4',
                         f'Flags: {", ".join(record["screening_flags"]) or "none detected"}',
                         'Payment verified: no','']
          state['runs']=int(state.get('runs',0))+1
          state['last_run_at']=now
          path.write_text(json.dumps(state,indent=2,ensure_ascii=False)+'\n')
          reports=pathlib.Path('reports')
          reports.mkdir(exist_ok=True)
          report += [f'New opportunities stored: {added}',f'Issues retrieved: {len(results)}',
                     *errors,'','No code execution, submissions, transactions or wallet access.']
          (reports/'credible-scout-latest.md').write_text('\n'.join(report)+'\n')
          print(f'Scouted {len(results)} public issues, stored {added}; no payment verified.')
          PY
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_state.json reports/credible-scout-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Agent: record evidence-based bounty discovery"
            git push
          fi
