name: AutonomousMillion Payment Evidence Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-million-state
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Review reward evidence without trusting issue claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re, urllib.parse, urllib.request, urllib.error
          path=pathlib.Path("agent_state.json")
          state=json.loads(path.read_text())
          blocked={x.lower() for x in state.get("blocked_repositories",[])}
          rejected={x.get("url") for x in state.get("rejected_opportunities",[])}
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          headers={"Accept":"application/vnd.github+json",
                   "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "User-Agent":"AutonomousMillion-PaymentAudit"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as resp:
                  return json.load(resp)
          reviews=[]
          for opportunity in state.get("opportunities",[]):
              if len(reviews)>=25:
                  break
              url=opportunity.get("url","")
              match=re.fullmatch(r"https://github\.com/([^/]+)/([^/]+)/issues/(\d+)",url)
              if not match:
                  continue
              owner,repo,num=match.groups()
              repo_name=(owner+"/"+repo).lower()
              if repo_name in blocked or url in rejected or opportunity.get("status","").startswith(("blocked","rejected")):
                  opportunity["payment_verified"]=False
                  reviews.append({"url":url,"verdict":"blocked","payment_verified":False})
                  continue
              review={"url":url,"checked_at":now,"payment_verified":False,
                      "verdict":"insufficient_independent_payment_evidence",
                      "maintainer_reward_confirmation":False,
                      "public_payment_proof_found":False,
                      "warnings":[]}
              try:
                  issue=get(f"https://api.github.com/repos/{owner}/{repo}/issues/{num}")
                  repository=get(f"https://api.github.com/repos/{owner}/{repo}")
                  if issue.get("state")!="open":
                      review["verdict"]="issue_not_open"
                  elif repository.get("archived") or repository.get("disabled"):
                      review["verdict"]="repository_inactive"
                  else:
                      body=(issue.get("title","")+"\n"+(issue.get("body") or ""))[:30000]
                      comments=get(f"https://api.github.com/repos/{owner}/{repo}/issues/{num}/comments?per_page=100")
                      trusted={repository.get("owner",{}).get("login","").lower()}
                      for c in comments:
                          if c.get("author_association") in ("OWNER","MEMBER","COLLABORATOR"):
                              trusted.add(c.get("user",{}).get("login","").lower())
                      confirmations=[c for c in comments if c.get("user",{}).get("login","").lower() in trusted
                                     and re.search(r"(?i)(reward|bounty|payment|payout).{0,100}(confirm|funded|escrow|paid)",c.get("body") or "")]
                      review["maintainer_reward_confirmation"]=bool(confirmations)
                      review["public_payment_proof_found"]=False
                      if not re.search(r"(?i)(?:\$\s?\d[\d,]*|\d+\s*(?:USDC|USD))",body):
                          review["warnings"].append("No clear USD-denominated reward in issue")
                      if not confirmations:
                          review["warnings"].append("No maintainer reward confirmation found in first 100 comments")
                      if re.search(r"(?i)(seed phrase|private key|connect your wallet|pay a fee|verification fee)",body):
                          review["verdict"]="safety_review"
                          review["warnings"].append("Potential credential/wallet/fee request")
                      # A maintainer's assertion is not independent proof of escrow or payout.
                      if confirmations and review["verdict"]=="insufficient_independent_payment_evidence":
                          review["verdict"]="maintainer_claim_only"
              except (urllib.error.HTTPError,urllib.error.URLError,ValueError,KeyError) as exc:
                  review["verdict"]="audit_incomplete"
                  review["warnings"].append(type(exc).__name__)
              opportunity["payment_verified"]=False
              opportunity["payment_review_status"]=review["verdict"]
              reviews.append(review)
          state["payment_reviews"]=reviews
          state["last_payment_audit_at"]=now
          path.write_text(json.dumps(state,indent=2,ensure_ascii=False)+"\n")
          lines=["# Payment evidence audit","",f"UTC: {now}","",
                 "No listing was classified as payment-verified. Claims, maintainer comments, and scores are not independent payout proof.",""]
          for r in reviews:
              lines += [f'- {r["verdict"]}: {r["url"]}',
                        f'  Maintainer confirmation: {r.get("maintainer_reward_confirmation",False)}; verified payment: false']
          lines += ["",f"Audited: {len(reviews)}","Verified funded opportunities: 0",
                    "No external submissions, third-party code execution, wallet use, or transactions."]
          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/payment-evidence-latest.md").write_text("\n".join(lines)+"\n")
          print(f"Reviewed {len(reviews)} opportunities; zero independently verified payouts.")
          PY
      - name: Commit evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_state.json reports/payment-evidence-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Agent: audit bounty payment evidence"
            git push
          fi
