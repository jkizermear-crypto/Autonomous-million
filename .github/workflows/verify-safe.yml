name: AutonomousMillion Opportunity Triage

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Autonomous Million Agent"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: autonomous-million-state
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Screen and enforce rejection history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re, urllib.error, urllib.request

          path = pathlib.Path('agent_state.json')
          state = json.loads(path.read_text())
          blocked = {x.get('url') for x in state.get('rejected_opportunities', [])}
          prior = {x.get('url'): x for x in state.get('triage', [])}
          results = []
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          suspicious = [
              (r'HUMAN_VERIFIED_SIGNATURE|human.verif(?:ied|ication).signature', 'External human signature requirement'),
              (r'(?:register|sign\s?up|verify|claim|unlock).{0,100}(?:credentials|wallet|private key|seed phrase|payment)', 'Potential credential, wallet, or payment demand'),
              (r'(?:pay|deposit|transfer).{0,70}(?:fee|USDC|USDT|ETH|SOL|crypto)', 'Possible upfront payment requirement'),
          ]
          for opportunity in state.get('opportunities', []):
              url = opportunity.get('url', '')
              title = opportunity.get('title', '')
              status, reason = 'needs_review', 'Not independently verified'
              if url in blocked or prior.get(url, {}).get('status') == 'rejected_safety_audit' or opportunity.get('status') == 'rejected_safety_audit':
                  status, reason = 'rejected_safety_audit', 'Previously blacklisted; do not reconsider'
              else:
                  match = re.fullmatch(r'https://github\.com/([^/]+)/([^/]+)/issues/(\d+)', url)
                  if not match:
                      status, reason = 'rejected', 'Not a valid GitHub issue URL'
                  else:
                      owner, repo, number = match.groups()
                      api = f'https://api.github.com/repos/{owner}/{repo}/issues/{number}'
                      req = urllib.request.Request(api, headers={
                          'Accept': 'application/vnd.github+json',
                          'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                          'User-Agent': 'AutonomousMillion-SafeTriage'})
                      try:
                          with urllib.request.urlopen(req, timeout=20) as response:
                              issue = json.load(response)
                          title = issue.get('title') or title
                          body = (issue.get('body') or '')[:16000]
                          combined = title + '\n' + body
                          if issue.get('state') != 'open' or 'pull_request' in issue:
                              status, reason = 'rejected', 'Closed issue or pull request'
                          elif any(re.search(pattern, combined, re.I | re.S) for pattern, _ in suspicious):
                              status = 'safety_review'
                              reason = next(label for pattern, label in suspicious if re.search(pattern, combined, re.I | re.S))
                          elif re.search(r'dependency dashboard|renovate|contest|sweepstakes|lottery|prediction market|weekly close', combined, re.I):
                              status, reason = 'rejected', 'Maintenance automation or contest'
                          elif re.search(r'\b(?:bounty|reward|payment|paid|prize)\b', combined, re.I) and re.search(r'(?:\$\s?\d+|\b\d+(?:\.\d+)?\s*(?:USDC|USDT|USD|ETH|SOL)\b)', combined, re.I):
                              status, reason = 'needs_review', 'Possible reward; payout and eligibility unverified'
                          else:
                              status, reason = 'rejected', 'No explicit monetary reward found'
                      except (urllib.error.HTTPError, urllib.error.URLError, ValueError) as exc:
                          status, reason = 'safety_review', f'Issue could not be checked: {type(exc).__name__}'
              results.append({'url': url, 'title': title[:180], 'status': status,
                              'reason': reason, 'checked_at': now})
              if status in ('rejected_safety_audit', 'safety_review'):
                  opportunity['status'] = status
          state['triage'] = results
          # Previously planned tasks must not remain executable after a safety rejection.
          unsafe = {r['url'] for r in results if r['status'] in ('rejected_safety_audit', 'safety_review')}
          for experiment in state.get('experiments', []):
              if experiment.get('opportunity_url') in unsafe:
                  experiment['status'] = 'blocked_safety_review'
          # Prior execution checks remain historical records; never delete evidence.
          path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')
          report = pathlib.Path('reports/triage-latest.md')
          report.parent.mkdir(exist_ok=True)
          lines = ['# AutonomousMillion safe opportunity triage', '',
                   'Automated screening only. No payout is verified. Safety-review candidates are NOT approved.', '',
                   f'Total: {len(results)}',
                   f'Potential candidates: {sum(x["status"] == "needs_review" for x in results)}',
                   f'Safety blocked/review: {sum(x["status"] in ("rejected_safety_audit", "safety_review") for x in results)}', '']
          lines += [f'- **{x["status"]}** — {x["url"]}: {x["reason"]}' for x in results]
          report.write_text('\n'.join(lines) + '\n')
          print(f'Screened {len(results)} issues; safety blocked/review {len(unsafe)}.')
          PY
      - name: Save screening results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_state.json reports/triage-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Agent: enforce safety triage"
            git push
          fi
