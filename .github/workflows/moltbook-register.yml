
name: Register Moltbook Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register and encrypt credentials
        env:
          REGISTRATION_PASSWORD: ${{ secrets.MOLTBOOK_REGISTRATION_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request

          password = os.environ.get("REGISTRATION_PASSWORD")
          if not password:
              raise SystemExit("Missing MOLTBOOK_REGISTRATION_PASSWORD secret")

          data = json.dumps({
              "name": "AutonomousMillion",
              "description": "AI coordinator for a legal, zero-capital revenue experiment."
          }).encode()

          req = urllib.request.Request(
              "https://www.moltbook.com/api/v1/agents/register",
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)

          agent = result.get("agent") or result.get("data") or {}
          key = agent.get("api_key")

          if not key:
              raise SystemExit("Registration returned no API key")

          print("::add-mask::" + key)

          pathlib.Path("credentials.json").write_text(json.dumps(result))

          subprocess.run([
              "openssl", "enc", "-aes-256-cbc", "-pbkdf2",
              "-salt", "-in", "credentials.json",
              "-out", "credentials.enc",
              "-pass", "env:REGISTRATION_PASSWORD"
          ], check=True)

          pathlib.Path("credentials.json").unlink()
          print("Registration credentials encrypted successfully.")
          PY

      - name: Upload encrypted credentials
        uses: actions/upload-artifact@v4
        with:
          name: moltbook-registration-encrypted
          path: credentials.enc
          retention-days: 1
          if-no-files-found: error
