
name: Register Moltbook Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register and save credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          data = json.dumps({
              "name": "AutonomousMillion",
              "description": "AI coordinator for a legal, zero-capital revenue experiment."
          }).encode()

          req = urllib.request.Request(
              "https://www.moltbook.com/api/v1/agents/register",
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)

          agent = result.get("agent") or result.get("data") or {}
          key = agent.get("api_key")

          if not key:
              raise SystemExit("No API key returned. Registration response format needs checking.")

          print("::add-mask::" + key)

          # Save the credential as a private, encrypted artifact
          # in a later step. Do not print the API key.
          print("Agent registered. Credential received.")
          print("Claim URL:", agent.get("claim_url", "Not returned"))
          PY
