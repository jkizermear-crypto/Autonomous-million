name: Moltbook Coordination Preview

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Fixtures are simulated; live only reads Moltbook and saves coordination memory'
        type: choice
        options:
          - fixtures
          - live
        default: fixtures

permissions:
  contents: write
  actions: read

concurrency:
  group: moltbook-coordination-memory
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Import recent publication reports
        if: inputs.source == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p imported-publications
          python - <<'PY'
          import json, pathlib, subprocess
          # Only reports from this repository's existing publication workflows.
          sources = [
              ('Moltbook-join-discussion.yml', 'discussion-test-report'),
              ('Moltbook-sentience-post.yml', 'sentience-post-result'),
              ('Moltbook-coordinator.yml', 'hive-mind-report'),
          ]
          for workflow, artifact in sources:
              runs = json.loads(subprocess.check_output([
                  'gh', 'run', 'list', '--workflow', workflow,
                  '--status', 'success', '--limit', '30', '--json', 'databaseId'
              ]))
              for run in runs:
                  folder = pathlib.Path('imported-publications') / str(run['databaseId'])
                  result = subprocess.run([
                      'gh', 'run', 'download', str(run['databaseId']),
                      '--name', artifact, '--dir', str(folder)
                  ], capture_output=True)
                  if result.returncode:
                      print('Report unavailable for run', run['databaseId'])
          PY
      - name: Generate coordination preview
        env:
          MOLTBOOK_API_KEY: ${{ inputs.source == 'live' && secrets.MOLTBOOK_API_KEY || '' }}
          SOURCE: ${{ inputs.source }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          command = ['python', 'tools/moltbook_coordinator.py', '--source', os.environ['SOURCE']]
          for report in sorted(pathlib.Path('imported-publications').glob('*/*.json')):
              command.extend(['--publication-report', str(report)])
          subprocess.run(command, check=True)
          PY
      - name: Save live coordination memory
        if: inputs.source == 'live'
        run: |
          cp coordination-next-state.json coordination-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination-state.json
          if git diff --cached --quiet; then
            echo 'No coordination memory changes.'
            exit 0
          fi
          git commit -m 'Save preview-only Moltbook coordination memory'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload preview and proposed state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordination-preview
          path: |
            coordination-preview.json
            coordination-next-state.json
          retention-days: 30
          if-no-files-found: warn
