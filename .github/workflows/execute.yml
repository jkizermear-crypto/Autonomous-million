name: AutonomousMillion Safe Executor

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["AutonomousMillion Experiment Engine"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: autonomous-million-state
  cancel-in-progress: false

jobs:
  safe-execution:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Perform read-only repository checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast, datetime, json, os, pathlib, re, urllib.request, urllib.error
          state_file = pathlib.Path('agent_state.json')
          state = json.loads(state_file.read_text())
          state.setdefault('execution_checks', [])
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          prior = {x['opportunity_url'] for x in state['execution_checks']}
          targets = [x for x in state.get('experiments', [])
                     if x.get('status') == 'planned_not_executed'
                     and x.get('opportunity_url') not in prior][:3]
          lines = ['# Safe Executor — read-only tests', '',
                   f'Checked at: {now}', '',
                   'No third-party code was run, no public submissions were made, and no funds were used.', '']
          headers = {'Accept': 'application/vnd.github+json',
                     'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'User-Agent': 'AutonomousMillion-SafeExecutor'}
          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)
          for plan in targets:
              url = plan['opportunity_url']
              m = re.fullmatch(r'https://github\.com/([^/]+)/([^/]+)/issues/(\d+)', url)
              if not m:
                  continue
              owner, repo, issue_num = m.groups()
              result = {'opportunity_url': url, 'checked_at': now,
                        'status': 'checked_no_execution', 'files_inspected': [],
                        'findings': [], 'payment_verified': False}
              try:
                  issue = fetch(f'https://api.github.com/repos/{owner}/{repo}/issues/{issue_num}')
                  result['issue_open'] = issue.get('state') == 'open'
                  root = fetch(f'https://api.github.com/repos/{owner}/{repo}/git/trees/HEAD?recursive=1')
                  paths = [x['path'] for x in root.get('tree', [])
                           if x.get('type') == 'blob']
                  result['repo_files_seen'] = len(paths)
                  result['tree_truncated'] = bool(root.get('truncated'))
                  interesting = [x for x in paths if x.endswith(('.py', '.ts', '.yml', '.yaml'))
                                 and not any(seg in x.lower() for seg in
                                             ('node_modules/', 'vendor/', 'dist/', '.github/'))]
                  result['candidate_source_files'] = len(interesting)
                  for path in interesting[:3]:
                      api_path = '/'.join(__import__('urllib.parse', fromlist=['quote']).quote(part, safe='')
                                          for part in path.split('/'))
                      content = fetch(f'https://api.github.com/repos/{owner}/{repo}/contents/{api_path}')
                      if content.get('encoding') != 'base64' or content.get('size', 0) > 100000:
                          continue
                      import base64
                      source = base64.b64decode(content['content']).decode('utf-8', 'replace')
                      entry = {'path': path, 'bytes': len(source.encode())}
                      if path.endswith('.py'):
                          try:
                              ast.parse(source)
                              entry['python_syntax'] = 'valid'
                          except SyntaxError as exc:
                              entry['python_syntax'] = f'error at line {exc.lineno}'
                      result['files_inspected'].append(entry)
                  result['findings'].append('Read-only metadata and source inspection completed; no bounty or payout verified.')
              except (urllib.error.HTTPError, urllib.error.URLError, ValueError) as exc:
                  result['status'] = 'inspection_error'
                  result['findings'].append(f'Could not inspect source: {type(exc).__name__}')
              state['execution_checks'].append(result)
              lines += [f'## {url}', f'Status: {result["status"]}',
                        f'Issue open: {result.get("issue_open", "unknown")}',
                        f'Source files found: {result.get("candidate_source_files", "unknown")}',
                        f'Files inspected: {json.dumps(result["files_inspected"])}',
                        *result['findings'], '']
          reports = pathlib.Path('reports')
          reports.mkdir(exist_ok=True)
          (reports / 'execution-latest.md').write_text('\n'.join(lines) + '\n')
          state_file.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n')
          print(f'Inspected {len(targets)} plans; no third-party code executed.')
          PY
      - name: Save inspection results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_state.json reports/execution-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Agent: record safe source inspections"
            git push
          fi
